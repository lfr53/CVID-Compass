<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">免疫细胞分工卡通图</title><desc id="desc">卡通形式介绍树突细胞、T细胞、B细胞、浆细胞和吞噬细胞的基本功能。</desc><rect width="1200" height="520" rx="36" fill="#fffaf2"/><g font-family="Arial, sans-serif" fill="#183a39" text-anchor="middle"><text x="600" y="58" font-size="28" font-weight="700">免疫系统像一支分工合作的小队</text><text x="600" y="88" font-size="17" fill="#54736b">CVID 可能影响其中一个或多个环节；不同患者受到影响的环节并不相同。</text><g stroke="#183a39" stroke-width="4"><circle cx="120" cy="245" r="78" fill="#f6c85f"/><circle cx="360" cy="245" r="78" fill="#dbead5"/><circle cx="600" cy="245" r="78" fill="#f7d7ce"/><circle cx="840" cy="245" r="78" fill="#d7e7ed"/><circle cx="1080" cy="245" r="78" fill="#e4d9ef"/></g><g fill="#183a39" stroke="none"><circle cx="94" cy="228" r="8"/><circle cx="146" cy="228" r="8"/><path d="M92 260q28 25 56 0" fill="none" stroke="#183a39" stroke-width="5" stroke-linecap="round"/><circle cx="334" cy="228" r="8"/><circle cx="386" cy="228" r="8"/><path d="M332 260q28 25 56 0" fill="none" stroke="#183a39" stroke-width="5" stroke-linecap="round"/><circle cx="574" cy="228" r="8"/><circle cx="626" cy="228" r="8"/><path d="M572 260q28 25 56 0" fill="none" stroke="#183a39" stroke-width="5" stroke-linecap="round"/><circle cx="814" cy="228" r="8"/><circle cx="866" cy="228" r="8"/><path d="M812 260q28 25 56 0" fill="none" stroke="#183a39" stroke-width="5" stroke-linecap="round"/><circle cx="1054" cy="228" r="8"/><circle cx="1106" cy="228" r="8"/><path d="M1052 260q28 25 56 0" fill="none" stroke="#183a39" stroke-width="5" stroke-linecap="round"/></g><g font-size="21" font-weight="700"><text x="120" y="360">吞噬细胞</text><text x="360" y="360">树突细胞</text><text x="600" y="360">T 细胞</text><text x="840" y="360">B 细胞</text><text x="1080" y="360">浆细胞</text></g><g font-size="16" fill="#496563"><text x="120" y="390">吃掉并清理</text><text x="120" y="414">病原体碎片</text><text x="360" y="390">把线索展示给</text><text x="360" y="414">T 细胞</text><text x="600" y="390">发出帮助或</text><text x="600" y="414">调节信号</text><text x="840" y="390">学习识别并</text><text x="840" y="414">形成记忆</text><text x="1080" y="390">制造抗体</text><text x="1080" y="414">保护身体</text></g><path d="M198 245h82m158 0h82m158 0h82m158 0h82" fill="none" stroke="#315f51" stroke-width="7" stroke-linecap="round"/><path d="m263 228 26 17-26 17m240-34 26 17-26 17m240-34 26 17-26 17m240-34 26 17-26 17" fill="none" stroke="#315f51" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="475" font-size="15" fill="#54736b">图为教育示意，不是患者化验结果，也不能用来判断个人病情。</text></g></svg>
