<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc"><title id="title">Immune checkpoint schematic</title><desc id="desc">A schematic of immune activation and the CTLA4 and LRBA checkpoint brake.</desc><rect width="900" height="260" rx="24" fill="#f1f5ee"/><g font-family="Arial, sans-serif" fill="#183a39"><circle cx="140" cy="130" r="64" fill="#f5cb61"/><text x="140" y="124" font-size="21" text-anchor="middle">T cell</text><text x="140" y="151" font-size="15" text-anchor="middle">免疫反应</text><path d="M210 130h150" stroke="#315f51" stroke-width="8" stroke-linecap="round"/><path d="m330 110 28 20-28 20" fill="none" stroke="#315f51" stroke-width="8"/><rect x="385" y="72" width="180" height="116" rx="18" fill="#f8ded5"/><text x="475" y="115" font-size="22" text-anchor="middle">CTLA-4</text><text x="475" y="145" font-size="15" text-anchor="middle">免疫刹车</text><text x="475" y="168" font-size="13" text-anchor="middle">LRBA 帮助回收</text><path d="M565 130h150" stroke="#315f51" stroke-width="8" stroke-linecap="round"/><path d="m695 110 28 20-28 20" fill="none" stroke="#315f51" stroke-width="8"/><circle cx="790" cy="130" r="58" fill="#d9e8d3"/><text x="790" y="124" font-size="20" text-anchor="middle">平衡</text><text x="790" y="151" font-size="15" text-anchor="middle">避免过度攻击</text></g></svg>
