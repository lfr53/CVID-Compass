<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="title desc"><title id="title">B cell to antibody schematic</title><desc id="desc">A patient-friendly schematic showing B-cell activation, memory and antibody production, with CVID research questions highlighted.</desc><rect width="900" height="280" rx="24" fill="#f1f5ee"/><g font-family="Arial, sans-serif" fill="#183a39" text-anchor="middle"><circle cx="130" cy="125" r="58" fill="#d9e8d3"/><text x="130" y="120" font-size="22">B cell</text><text x="130" y="148" font-size="15">识别线索</text><path d="M190 125h130" stroke="#315f51" stroke-width="8" stroke-linecap="round"/><path d="m295 105 28 20-28 20" fill="none" stroke="#315f51" stroke-width="8"/><circle cx="390" cy="125" r="58" fill="#f8ded5"/><text x="390" y="120" font-size="20">Memory</text><text x="390" y="148" font-size="15">记忆 B 细胞</text><path d="M450 125h130" stroke="#315f51" stroke-width="8" stroke-linecap="round"/><path d="m555 105 28 20-28 20" fill="none" stroke="#315f51" stroke-width="8"/><circle cx="650" cy="125" r="58" fill="#f5cb61"/><text x="650" y="120" font-size="20">Plasma</text><text x="650" y="148" font-size="15">浆细胞</text><path d="M708 125h90" stroke="#315f51" stroke-width="8" stroke-linecap="round"/><path d="m775 105 28 20-28 20" fill="none" stroke="#315f51" stroke-width="8"/><text x="850" y="112" font-size="19">抗体</text><text x="850" y="140" font-size="15">保护反应</text><text x="450" y="235" font-size="16">CVID 研究：哪一步受到影响？每个人可能不同。</text></g></svg>
